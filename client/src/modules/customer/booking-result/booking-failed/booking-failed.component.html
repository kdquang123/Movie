<div class="flex flex-col items-center justify-center px-4 py-12">
  <div
    class="bg-darker rounded-lg border border-gray-800 p-8 max-w-2xl w-full text-center"
  >
    <!-- Failure Icon -->
    <div class="text-red-500 text-6xl mb-6">
      <fa-icon [icon]="faTimesCircle"></fa-icon>
    </div>

    <h1 class="text-2xl font-bold mb-4">THANH TOÁN KHÔNG THÀNH CÔNG</h1>

    <p class="text-gray-400 mb-6">
      Bạn có thể thử thanh toán lại hoặc chọn phương thức thanh toán khác.
    </p>

    <div class="flex flex-col sm:flex-row justify-center gap-4">
      <button
        [routerLink]="['/booking/payment']"
        class="border border-gray-700 hover:border-primary hover:text-primary px-6 py-3 rounded-md font-medium transition"
      >
        <i class="fas fa-redo mr-2"></i> Thử lại
      </button>
      <button
        [routerLink]="['/booking/seats']"
        class="bg-primary hover:bg-red-700 px-6 py-3 rounded-md font-medium transition"
      >
        <i class="fas fa-arrow-left mr-2"></i> Quay lại đặt vé
      </button>
    </div>
  </div>
</div>
