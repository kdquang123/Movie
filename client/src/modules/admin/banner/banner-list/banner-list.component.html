<!-- Header và Add Button -->
<div
  class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4"
>
  <div>
    <h2 class="text-lg font-semibold text-gray-800">Quản lý Carousel</h2>
    <p class="text-sm text-gray-500">
      Quản lý các slide carousel hiển thị trên trang chủ
    </p>
  </div>
  <div class="flex space-x-3">
    <button
      routerLink="/admin/banners/add"
      id="add-carousel-btn"
      class="bg-primary hover:bg-red-700 px-4 py-2 rounded-md text-white font-medium transition"
    >
      <fa-icon [icon]="faPlus"></fa-icon> Thêm slide mới
    </button>
  </div>
</div>

<!-- Table -->
<div class="carousel">
  <div class="carousel-item mb-4" *ngFor="let banner of banners; let i = index">
    <button (click)="delete(banner.id)" class="btn-delete z-10 absolute top-4 right-5 px-4 py-2 bg-primary rounded-[4px] cursor-pointer hover:bg-red-700 text-white"><fa-icon [icon]="faTrash"></fa-icon> Xóa</button>
    <img [src]="banner.imageUrl" alt="banner image" />
    <div class="gradient-overlay w-full flex items-center h-full z-2 text-white">
      <div class="container mx-auto px-4">
        <div class="max-w-2xl">
          <span class="text-primary font-medium">{{
            banner.bannerType == "Movie" ? "PHIM ĐANG HOT" : "TIN MỚI"
          }}</span>
          <h1 class="text-3xl md:text-2xl font-bold my-4">
            {{
              banner.bannerType == "Movie"
                ? banner.film.name
                : banner.news.title
            }}
          </h1>
          <div
            *ngIf="banner.bannerType == 'Movie'"
            class="flex items-center space-x-4 mb-6"
          >
            <span class="text-primary">
              <fa-icon [icon]="faStar" class="mr-1"></fa-icon>
              {{ banner.film.imDbScore }}/10
            </span>
            <span>{{ formatMinuteToHour(banner.film.duration) }}</span>
            <span></span>
          </div>
          <div class="flex space-x-4"></div>
        </div>
      </div>
    </div>
  </div>
</div>
