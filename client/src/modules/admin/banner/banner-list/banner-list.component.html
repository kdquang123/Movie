<!-- Header và Add Button -->
<div
  class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4"
>
  <div>
    <h2 class="text-lg font-semibold text-gray-800">Quản lý Carousel</h2>
    <p class="text-sm text-gray-500">
      Quản lý các slide carousel hiển thị trên trang chủ
    </p>
  </div>
  <div class="flex space-x-3">
    <button
      routerLink="/admin/banners/add"
      id="add-carousel-btn"
      class="bg-primary hover:bg-red-700 px-4 py-2 rounded-md text-white font-medium transition"
    >
      <fa-icon [icon]="faPlus"></fa-icon> Thêm slide mới
    </button>
  </div>
</div>

<!-- Preview Current Carousel -->
<div class="bg-dark rounded-lg overflow-hidden mb-6 relative">
  <div class="aspect-[21/9] relative">
    <img
      src="https://source.unsplash.com/random/1920x820/?movie,cinema,dark"
      alt="Current carousel preview"
      class="w-full h-full object-cover"
    />
    <div
      class="absolute inset-0 bg-gradient-to-r from-black/70 to-transparent flex items-center"
    >
      <div class="px-10 max-w-lg">
        <p class="text-primary font-bold text-lg">Đang chiếu</p>
        <h3 class="text-white text-3xl font-bold mb-3">The Batman</h3>
        <p class="text-gray-200 mb-5">
          Một bộ phim hành động tội phạm của DC Comics đưa người xem vào thế
          giới đen tối của Gotham City
        </p>
        <div class="flex space-x-3">
          <a
            href="#"
            class="bg-primary hover:bg-red-700 px-5 py-2 rounded text-white font-medium transition"
            >Đặt vé ngay</a
          >
          <a
            href="#"
            class="bg-gray-800/80 hover:bg-gray-700 px-5 py-2 rounded text-white font-medium transition"
            >Chi tiết</a
          >
        </div>
      </div>
    </div>
    <div class="absolute bottom-4 right-4 flex space-x-1">
      <button class="w-3 h-3 rounded-full bg-white bg-opacity-80"></button>
      <button class="w-3 h-3 rounded-full bg-white bg-opacity-40"></button>
      <button class="w-3 h-3 rounded-full bg-white bg-opacity-40"></button>
      <button class="w-3 h-3 rounded-full bg-white bg-opacity-40"></button>
    </div>
  </div>
  <div
    class="absolute top-3 right-3 bg-black/50 text-white px-3 py-1 rounded-full text-xs"
  >
    Đang xem trước: Slide 1/4
  </div>
</div>

<!-- Tools and Settings -->
<div class="bg-gray-50 p-4 rounded-lg mb-6">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="relative">
      <span
        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
      >
        <i class="fas fa-search text-gray-400"></i>
      </span>
      <input
        type="text"
        placeholder="Tìm kiếm slide..."
        class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
      />
    </div>

    <div>
      <select
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
      >
        <option value="">Tất cả trạng thái</option>
        <option value="active">Đang hoạt động</option>
        <option value="inactive">Không hoạt động</option>
        <option value="scheduled">Đã lên lịch</option>
      </select>
    </div>

    <div class="flex space-x-2">
      <button
        class="bg-primary px-4 py-2 rounded-md text-white font-medium hover:bg-red-700 transition"
      >
        <fa-icon [icon]="faFilter"></fa-icon> Lọc
      </button>
      <button
        class="border border-gray-300 px-4 py-2 rounded-md text-gray-700 font-medium hover:bg-gray-100 transition"
      >
        <fa-icon [icon]="faRedoAlt"></fa-icon> Đặt lại
      </button>
    </div>
  </div>
</div>

<!-- Table -->
<app-table
  [data]="data"
  [columns]="columns"
  [isShowNumber]="true"
  [currentPage]="currentPage"
  [currentPageSize]="currentPageSize"
  [pageSizeOptions]="pageSizeOptions"
  (onPageChange)="onPageChange($event)"
  (onPageSizeChange)="onPageSizeChange($event)"
>
</app-table>
