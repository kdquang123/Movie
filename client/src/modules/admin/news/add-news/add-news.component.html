<!-- Add News Form -->
<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
  <form [formGroup]="newsForm">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column - Featured Image & Basic Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Featured Image -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Ảnh đại diện <span class="text-red-500">*</span></label
            >
            <div
              class="file-upload relative rounded-lg p-8 text-center cursor-pointer hover:bg-gray-50 transition"
            >
              <input
                (change)="onImageChange($event)"
                title="image"
                type="file"
                id="featured-image"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                accept="image/*"
              />
              <div class="flex flex-col items-center justify-center">
                <fa-icon
                  [icon]="faCloudUploadAlt"
                  class="text-3xl text-primary mb-2"
                ></fa-icon>
                <p class="text-sm text-gray-600">
                  Kéo thả ảnh vào đây hoặc click để chọn
                </p>
                <p class="text-xs text-gray-500 mt-1">
                  Định dạng: JPG, PNG (Tối đa 5MB)
                </p>
              </div>
            </div>
            <div id="image-preview" class="mt-2 hidden">
              <img
                id="preview"
                src="#"
                alt="Preview"
                class="max-w-full h-auto rounded-lg border border-gray-200"
              />
            </div>
          </div>

          <!-- Categories -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Danh mục <span class="text-red-500">*</span></label
            >
            <div class="space-y-2">
              <div class="flex items-center">
                <input
                  formControlName="category"
                  type="radio"
                  id="news"
                  name="category"
                  value="News"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                  checked
                />
                <label for="news" class="ml-2 text-sm text-gray-700"
                  >Tin tức</label
                >
              </div>
              <div class="flex items-center">
                <input
                  formControlName="category"
                  type="radio"
                  id="promotion"
                  name="category"
                  value="Promotion"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                />
                <label for="promotion" class="ml-2 text-sm text-gray-700"
                  >Khuyến mãi</label
                >
              </div>
              <div class="flex items-center">
                <input
                  formControlName="category"
                  type="radio"
                  id="event"
                  name="category"
                  value="Event"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                />
                <label for="event" class="ml-2 text-sm text-gray-700"
                  >Sự kiện</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Middle & Right Columns - Content -->
      <div class="lg:col-span-2">
        <div class="space-y-6">
          <!-- Title -->
          <div>
            <label
              for="title"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Tiêu đề <span class="text-red-500">*</span></label
            >
            <input
              formControlName="title"
              type="text"
              id="title"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập tiêu đề tin tức"
              required
            />
          </div>

          <!-- Content -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Nội dung <span class="text-red-500">*</span></label
            >
            <div id="editor"></div>
            <div class="NgxEditor__Wrapper h-[300px]">
              <ngx-editor-menu [editor]="editor"> </ngx-editor-menu>
              <ngx-editor
                formControlName="content"
                [editor]="editor"
                [placeholder]="'Type here...'"
              ></ngx-editor>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="mt-8 flex justify-end space-x-3">
      <button
        routerLink="/admin/news"
        type="button"
        class="border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-md font-medium text-gray-700 transition"
      >
        Hủy bỏ
      </button>
      <button
        (click)="onSubmit()"
        type="submit"
        class="bg-primary hover:bg-red-700 px-6 py-2 rounded-md font-medium text-white transition"
      >
        <fa-icon [icon]="faSave" class="mr-2"></fa-icon> Lưu tin tức
      </button>
    </div>
  </form>
</div>
