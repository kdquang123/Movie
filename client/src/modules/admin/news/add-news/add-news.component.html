<!-- Add News Form -->
<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
  <form>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column - Featured Image & Basic Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Featured Image -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Ảnh đại diện <span class="text-red-500">*</span></label
            >
            <div
              class="file-upload relative rounded-lg p-8 text-center cursor-pointer hover:bg-gray-50 transition"
            >
              <input
                type="file"
                id="featured-image"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                accept="image/*"
              />
              <div class="flex flex-col items-center justify-center">
                <i
                  class="fas fa-cloud-upload-alt text-3xl text-primary mb-2"
                ></i>
                <p class="text-sm text-gray-600">
                  Kéo thả ảnh vào đây hoặc click để chọn
                </p>
                <p class="text-xs text-gray-500 mt-1">
                  Định dạng: JPG, PNG (Tối đa 5MB)
                </p>
              </div>
            </div>
            <div id="image-preview" class="mt-2 hidden">
              <img
                id="preview"
                src="#"
                alt="Preview"
                class="max-w-full h-auto rounded-lg border border-gray-200"
              />
            </div>
          </div>

          <!-- Categories -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Danh mục <span class="text-red-500">*</span></label
            >
            <div class="space-y-2">
              <div class="flex items-center">
                <input
                  type="radio"
                  id="news"
                  name="category"
                  value="news"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                  checked
                />
                <label for="news" class="ml-2 text-sm text-gray-700"
                  >Tin tức</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="radio"
                  id="promotion"
                  name="category"
                  value="promotion"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                />
                <label for="promotion" class="ml-2 text-sm text-gray-700"
                  >Khuyến mãi</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="radio"
                  id="event"
                  name="category"
                  value="event"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                />
                <label for="event" class="ml-2 text-sm text-gray-700"
                  >Sự kiện</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="radio"
                  id="other"
                  name="category"
                  value="other"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                />
                <label for="other" class="ml-2 text-sm text-gray-700"
                  >Khác</label
                >
              </div>
            </div>
          </div>

          <!-- Publish Date -->
          <div>
            <label
              for="publish-date"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Ngày đăng <span class="text-red-500">*</span></label
            >
            <input
              type="datetime-local"
              id="publish-date"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            />
          </div>

          <!-- Status -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Trạng thái <span class="text-red-500">*</span></label
            >
            <select
              id="status"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="draft">Bản nháp</option>
              <option value="published" selected>Đã đăng</option>
              <option value="archived">Lưu trữ</option>
            </select>
          </div>

          <!-- Featured Post -->
          <div>
            <div class="flex items-center">
              <input
                type="checkbox"
                id="featured"
                class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
              />
              <label for="featured" class="ml-2 text-sm text-gray-700"
                >Tin nổi bật</label
              >
            </div>
          </div>
        </div>
      </div>

      <!-- Middle & Right Columns - Content -->
      <div class="lg:col-span-2">
        <div class="space-y-6">
          <!-- Title -->
          <div>
            <label
              for="title"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Tiêu đề <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              id="title"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập tiêu đề tin tức"
              required
            />
          </div>

          <!-- Slug -->
          <div>
            <label
              for="slug"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Đường dẫn tĩnh (URL)</label
            >
            <div class="flex">
              <span
                class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm"
              >
                cinedark.com/news/
              </span>
              <input
                type="text"
                id="slug"
                class="flex-1 min-w-0 block w-full px-3 py-2 rounded-none rounded-r-md border border-gray-300 focus:outline-none focus:ring-1 focus:ring-primary"
                placeholder="tin-tuc-moi"
              />
            </div>
          </div>

          <!-- Excerpt -->
          <div>
            <label
              for="excerpt"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Mô tả ngắn <span class="text-red-500">*</span></label
            >
            <textarea
              id="excerpt"
              rows="3"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập mô tả ngắn về tin tức"
              required
            ></textarea>
          </div>

          <!-- Content -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Nội dung <span class="text-red-500">*</span></label
            >
            <div id="editor"></div>
            <input type="hidden" id="content" name="content" />
          </div>

          <!-- Tags -->
          <div>
            <label
              for="tags"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Thẻ tag</label
            >
            <input
              type="text"
              id="tags"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập các thẻ tag, cách nhau bằng dấu phẩy"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="mt-8 flex justify-end space-x-3">
      <button
        type="button"
        class="border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-md font-medium text-gray-700 transition"
      >
        Hủy bỏ
      </button>
      <button
        type="submit"
        class="bg-primary hover:bg-red-700 px-6 py-2 rounded-md font-medium text-white transition"
      >
        <i class="fas fa-save mr-2"></i> Lưu tin tức
      </button>
    </div>
  </form>
</div>
