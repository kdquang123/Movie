<!-- Add Movie Form -->
<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
  <form [formGroup]="movieForm" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column - Poster & Media -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Movie Title -->
          <div>
            <label
              for="title"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Tên phim <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              id="title"
              formControlName="title"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập tên phim"
            />
          </div>

          <!-- Release Date -->
          <div>
            <label
              for="release-date"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Ngày phát hành <span class="text-red-500">*</span></label
            >
            <input
              type="date"
              id="release-date"
              formControlName="releaseDate"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
            />
          </div>

          <!-- End Date -->
          <div>
            <label
              for="end-date"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Ngày kết thúc <span class="text-red-500">*</span></label
            >
            <input
              title="movie end date"
              type="date"
              id="end-date"
              formControlName="endDate"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
            />
          </div>

          <!-- Duration -->
          <div>
            <label
              for="duration"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Thời lượng (phút) <span class="text-red-500">*</span></label
            >
            <input
              type="number"
              id="duration"
              formControlName="duration"
              min="1"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="120"
            />
          </div>

          <!-- Categories -->
          <div>
            <label
              for="category"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Thể loại <span class="text-red-500">*</span></label
            >
            <div class="grid grid-cols-2 gap-2">
              <div
                *ngFor="let category of categoryList; let i = index"
                class="flex items-center"
              >
                <input
                  type="checkbox"
                  [id]="`category-${ i }`"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                  (change)="
                    onCategoryChange(category.id, $event.target.checked)
                  "
                />
                <label
                  [for]="`category-${ i }`"
                  class="ml-2 text-sm text-gray-700"
                  >{{ category.name }}</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Middle Column - Basic Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Director -->
          <div>
            <label
              for="director"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Đạo diễn</label
            >
            <input
              type="text"
              id="director"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập tên đạo diễn"
            />
          </div>

          <!-- Cast -->
          <div>
            <label
              for="cast"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Diễn viên</label
            >
            <textarea
              id="cast"
              rows="3"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập tên các diễn viên, cách nhau bằng dấu phẩy"
            ></textarea>
          </div>

          <!-- Rating -->
          <div>
            <label
              for="rating"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Đánh giá (IMDb)</label
            >
            <div class="flex items-center">
              <input
                type="number"
                id="rating"
                min="0"
                max="10"
                step="0.1"
                class="w-20 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
                placeholder="8.5"
              />
            </div>
          </div>

          <!-- Age Limit -->
          <div>
            <label
              for="age-limit"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Giới hạn tuổi</label
            >
            <select
              id="age-limit"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
            >
              <option
                *ngFor="let ageRestriction of ageRestrictionList"
                [value]="ageRestriction.id"
              >
                {{`${ageRestriction.code} - ${ageRestriction.description}`}}
              </option>
            </select>
          </div>
        </div>
      </div>

      <!-- Right Column - Additional Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Poster Upload -->
          <div>
            <label
              for="poster"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Poster phim</label
            >
            <div
              class="file-upload relative rounded-lg p-8 text-center cursor-pointer hover:bg-gray-50 transition"
            >
              <input
                title="movie poster input"
                type="file"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                accept="image/*"
                (change)="onFileChange($event)"
              />
              <div class="flex flex-col items-center justify-center">
                <fa-icon
                  [icon]="faCloudUploadAlt"
                  class="text-3xl text-primary mb-2"
                ></fa-icon>
                <p class="text-sm text-gray-600">
                  Kéo thả poster vào đây hoặc click để chọn
                </p>
                <p class="text-xs text-gray-500 mt-1">
                  Định dạng: JPG, PNG (Tối đa 5MB)
                </p>
              </div>
            </div>
          </div>

          <!-- Trailer Link -->
          <div>
            <label
              for="trailer"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Link Trailer (YouTube)</label
            >
            <input
              type="url"
              id="trailer"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="https://youtube.com/watch?v=..."
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Description -->
    <div class="mt-8">
      <label
        for="description"
        class="block text-sm font-medium text-gray-700 mb-2"
        >Mô tả phim <span class="text-red-500">*</span></label
      >
      <textarea
        id="description"
        formControlName="description"
        rows="5"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
        placeholder="Nhập mô tả chi tiết về phim"
        required
      ></textarea>
    </div>

    <!-- Form Actions -->
    <div class="mt-8 flex justify-end space-x-3">
      <button
        type="button"
        class="border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-md font-medium text-gray-700 transition"
      >
        Hủy bỏ
      </button>
      <button
        type="submit"
        class="bg-primary hover:bg-red-700 px-6 py-2 rounded-md font-medium text-white transition"
      >
        <fa-icon [icon]="faSave" class="mr-2"></fa-icon> Lưu phim
      </button>
    </div>
  </form>
</div>
