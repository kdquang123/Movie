<!-- Add Screening Form -->
<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
  <form>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Left Column - Basic Info -->
      <div>
        <div class="space-y-6">
          <!-- Movie Selection -->
          <div>
            <label
              for="movie"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Chọn phim <span class="text-red-500">*</span></label
            >
            <select
              id="movie"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="">-- Chọn phim --</option>
              <option value="1">Avengers: Endgame</option>
              <option value="2">Spider-Man: No Way Home</option>
              <option value="3">The Batman</option>
              <option value="4">Dune: Part Two</option>
              <option value="5">Black Panther: Wakanda Forever</option>
            </select>
          </div>

          <!-- Cinema Selection -->
          <div>
            <label
              for="cinema"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Chọn rạp <span class="text-red-500">*</span></label
            >
            <select
              id="cinema"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="">-- Chọn rạp --</option>
              <option value="1">CineDark Hà Nội</option>
              <option value="2">CineDark Hồ Chí Minh</option>
              <option value="3">CineDark Đà Nẵng</option>
              <option value="4">CineDark Hải Phòng</option>
            </select>
          </div>

          <!-- Theater Selection -->
          <div>
            <label
              for="theater"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Chọn phòng chiếu <span class="text-red-500">*</span></label
            >
            <select
              id="theater"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="">-- Chọn phòng chiếu --</option>
              <option value="1">Phòng 1 - 2D</option>
              <option value="2">Phòng 2 - 3D</option>
              <option value="3">Phòng 3 - IMAX</option>
              <option value="4">Phòng 4 - 4DX</option>
            </select>
          </div>

          <!-- Date Selection -->
          <div>
            <label
              for="date"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Ngày chiếu <span class="text-red-500">*</span></label
            >
            <input
              type="date"
              id="date"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            />
          </div>
        </div>
      </div>

      <!-- Right Column - Time Slots -->
      <div>
        <div class="space-y-6">
          <!-- Time Slots -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Chọn khung giờ <span class="text-red-500">*</span></label
            >
            <div class="grid grid-cols-3 gap-3">
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="slot1"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                />
                <label for="slot1" class="ml-2 text-sm text-gray-700"
                  >08:00</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="slot2"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                />
                <label for="slot2" class="ml-2 text-sm text-gray-700"
                  >10:30</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="slot3"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                />
                <label for="slot3" class="ml-2 text-sm text-gray-700"
                  >13:00</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="slot4"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                />
                <label for="slot4" class="ml-2 text-sm text-gray-700"
                  >15:30</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="slot5"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                />
                <label for="slot5" class="ml-2 text-sm text-gray-700"
                  >18:00</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="slot6"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                />
                <label for="slot6" class="ml-2 text-sm text-gray-700"
                  >20:30</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="checkbox"
                  id="slot7"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                />
                <label for="slot7" class="ml-2 text-sm text-gray-700"
                  >22:00</label
                >
              </div>
            </div>
          </div>

          <!-- Price Settings -->
          <div>
            <label
              for="price"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Giá vé (VND) <span class="text-red-500">*</span></label
            >
            <input
              type="number"
              id="price"
              min="50000"
              step="10000"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="100000"
              required
            />
          </div>

          <!-- Format Selection -->
          <div>
            <label
              for="format"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Định dạng <span class="text-red-500">*</span></label
            >
            <select
              id="format"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="2d">2D</option>
              <option value="3d">3D</option>
              <option value="imax">IMAX</option>
              <option value="4dx">4DX</option>
            </select>
          </div>

          <!-- Language Selection -->
          <div>
            <label
              for="language"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Ngôn ngữ <span class="text-red-500">*</span></label
            >
            <select
              id="language"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="vi">Tiếng Việt</option>
              <option value="en">Tiếng Anh - Phụ đề Việt</option>
              <option value="en-vi">Song ngữ Anh-Việt</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="mt-8 flex justify-end space-x-3">
      <button
        type="button"
        class="border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-md font-medium text-gray-700 transition"
      >
        Hủy bỏ
      </button>
      <button
        type="submit"
        class="bg-primary hover:bg-red-700 px-6 py-2 rounded-md font-medium text-white transition"
      >
        <i class="fas fa-save mr-2"></i> Lưu suất chiếu
      </button>
    </div>
  </form>
</div>
