<!-- Add Product Form -->
<div
  class="bg-white border border-gray-200 rounded-lg shadow-sm p-6"
  id="productForm"
>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column - Image & Basic Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Product Image -->
          <div>
            <label for="product-image" class="block text-sm font-medium text-gray-700 mb-2"
              >Hình ảnh sản phẩm <span class="text-red-500">*</span></label
            >
            <div
              class="file-upload relative rounded-lg p-8 text-center cursor-pointer hover:bg-gray-50 transition"
            >
              <input
                (change)="onFileSelected($event)"
                id="product-image"
                title="product image"
                type="file"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                accept="image/*"
              />
              <div class="flex flex-col items-center justify-center">
                <fa-icon
                  [icon]="faCloundUploadAlt"
                  class="text-3xl text-primary mb-2"
                ></fa-icon>
                <p class="text-sm text-gray-600">
                  Kéo thả hình ảnh vào đây hoặc click để chọn
                </p>
                <p class="text-xs text-gray-500 mt-1">
                  Định dạng: JPG, PNG (Tối đa 5MB)
                </p>
              </div>
            </div>
            <!-- Preview -->
            <div *ngIf="imagePreview" class="mt-4">
              <p class="text-sm text-gray-700 mb-1">Xem trước:</p>
              <img
                [src]="imagePreview"
                alt="Poster preview"
                class="w-48 h-auto rounded-lg shadow"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Middle Column - Product Details -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Product Name -->
          <div>
            <label
              for="product-name"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Tên sản phẩm <span class="text-red-500">*</span></label
            >
            <input
              formControlName="name"
              type="text"
              id="product-name"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập tên sản phẩm"
              required
            />
          </div>

          <!-- Price -->
          <div>
            <label
              for="price"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Giá bán (VND) <span class="text-red-500">*</span></label
            >
            <input
              formControlName="price"
              type="number"
              id="price"
              min="0"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập giá bán"
              required
            />
          </div>
        </div>
      </div>

      <!-- Right Column - Additional Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Description -->
          <div>
            <label
              for="description"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Mô tả sản phẩm</label
            >
            <textarea
              formControlName="description"
              id="description"
              rows="4"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập mô tả sản phẩm"
            ></textarea>
          </div>

          <!-- Inventory -->
          <div>
            <label
              for="inventory"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Số lượng tồn kho</label
            >
            <input
              formControlName="quantity"
              type="number"
              id="inventory"
              min="0"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập số lượng"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="mt-8 flex justify-end space-x-3">
      <button
        routerLink="admin/products"
        type="button"
        class="border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-md font-medium text-gray-700 transition"
      >
        Hủy bỏ
      </button>
      <button
        type="submit"
        class="bg-primary hover:bg-red-700 px-6 py-2 rounded-md font-medium text-white transition"
      >
        <fa-icon [icon]="faSave"></fa-icon> Lưu sản phẩm
      </button>
    </div>
  </form>
</div>
