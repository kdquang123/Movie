<!-- Add Employee Form -->
<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
  <form>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column - Avatar & Account Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Role -->
          <div>
            <label
              for="role"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Vị trí <span class="text-red-500">*</span></label
            >
            <select
              id="role"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="">-- Chọn vị trí --</option>
              <option value="manager">Quản lý rạp</option>
              <option value="staff">Nhân viên bán vé</option>
              <option value="support">Nhân viên hỗ trợ</option>
              <option value="projectionist">Nhân viên chiếu phim</option>
              <option value="cleaner">Nhân viên vệ sinh</option>
            </select>
          </div>

          <!-- Status -->
          <div>
            <label
              for="status"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Trạng thái <span class="text-red-500">*</span></label
            >
            <div class="space-y-2">
              <div class="flex items-center">
                <input
                  type="radio"
                  id="active"
                  name="status"
                  value="active"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                  checked
                />
                <label for="active" class="ml-2 text-sm text-gray-700"
                  >Đang làm việc</label
                >
              </div>
              <div class="flex items-center">
                <input
                  type="radio"
                  id="inactive"
                  name="status"
                  value="inactive"
                  class="h-4 w-4 text-primary focus:ring-primary border-gray-300"
                />
                <label for="inactive" class="ml-2 text-sm text-gray-700"
                  >Đã nghỉ việc</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Middle Column - Personal Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Full Name -->
          <div>
            <label
              for="fullname"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Họ và tên <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              id="fullname"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập họ và tên"
              required
            />
          </div>

          <!-- Email -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Email <span class="text-red-500">*</span></label
            >
            <input
              type="email"
              id="email"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập email công ty"
              required
            />
          </div>

          <!-- Phone -->
          <div>
            <label
              for="phone"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Số điện thoại <span class="text-red-500">*</span></label
            >
            <input
              type="tel"
              id="phone"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập số điện thoại"
              required
            />
          </div>

          <!-- ID Card -->
          <div>
            <label
              for="id-card"
              class="block text-sm font-medium text-gray-700 mb-2"
              >CMND/CCCD <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              id="id-card"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập số CMND/CCCD"
              required
            />
          </div>
        </div>
      </div>

      <!-- Right Column - Work Info -->
      <div class="lg:col-span-1">
        <div class="space-y-6">
          <!-- Cinema Assignment -->
          <div>
            <label
              for="cinema"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Rạp làm việc <span class="text-red-500">*</span></label
            >
            <select
              id="cinema"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            >
              <option value="">-- Chọn rạp --</option>
              <option value="1">CineDark Hà Nội</option>
              <option value="2">CineDark Hồ Chí Minh</option>
              <option value="3">CineDark Đà Nẵng</option>
              <option value="4">CineDark Hải Phòng</option>
            </select>
          </div>

          <!-- Start Date -->
          <div>
            <label
              for="start-date"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Ngày bắt đầu <span class="text-red-500">*</span></label
            >
            <input
              type="date"
              id="start-date"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              required
            />
          </div>

          <!-- Salary -->
          <div>
            <label
              for="salary"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Mức lương (VND) <span class="text-red-500">*</span></label
            >
            <input
              type="number"
              id="salary"
              min="0"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
              placeholder="Nhập mức lương"
              required
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Address -->
      <div>
        <label
          for="address"
          class="block text-sm font-medium text-gray-700 mb-2"
          >Địa chỉ <span class="text-red-500">*</span></label
        >
        <textarea
          id="address"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
          placeholder="Nhập địa chỉ"
          required
        ></textarea>
      </div>

      <!-- Notes -->
      <div>
        <label for="notes" class="block text-sm font-medium text-gray-700 mb-2"
          >Ghi chú</label
        >
        <textarea
          id="notes"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-primary"
          placeholder="Nhập ghi chú (nếu có)"
        ></textarea>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="mt-8 flex justify-end space-x-3">
      <button
        type="button"
        class="border border-gray-300 hover:bg-gray-100 px-4 py-2 rounded-md font-medium text-gray-700 transition"
      >
        Hủy bỏ
      </button>
      <button
        type="submit"
        class="bg-primary hover:bg-red-700 px-6 py-2 rounded-md font-medium text-white transition"
      >
        <i class="fas fa-save mr-2"></i> Tạo nhân viên
      </button>
    </div>
  </form>
</div>
