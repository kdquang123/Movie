<!-- Stats Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
  <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
    <div class="flex justify-between items-start">
      <div>
        <p class="text-gray-500 text-sm">Tổng doanh thu</p>
        <h3 class="text-2xl font-bold mt-1">
          1 <span class="text-lg">triệu</span>
        </h3>
      </div>
      <div class="bg-red-100 p-3 rounded-full text-primary">
        <fa-icon [icon]="faWallet" class="fas fa-wallet"></fa-icon>
      </div>
    </div>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
    <div class="flex justify-between items-start">
      <div>
        <p class="text-gray-500 text-sm">Tổng vé bán</p>
        <h3 class="text-2xl font-bold mt-1">9</h3>
      </div>
      <div class="bg-blue-100 p-3 rounded-full text-blue-500">
        <fa-icon [icon]="faTicketAlt" class="fas fa-ticket-alt"></fa-icon>
      </div>
    </div>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
    <div class="flex justify-between items-start">
      <div>
        <p class="text-gray-500 text-sm">Phim đang chiếu</p>
        <h3 class="text-2xl font-bold mt-1">8</h3>
      </div>
      <div class="bg-purple-100 p-3 rounded-full text-purple-500">
        <fa-icon [icon]="faFilm" class="fas fa-film"></fa-icon>
      </div>
    </div>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
    <div class="flex justify-between items-start">
      <div>
        <p class="text-gray-500 text-sm">Thành viên mới</p>
        <h3 class="text-2xl font-bold mt-1">0</h3>
      </div>
      <div class="bg-green-100 p-3 rounded-full text-green-500">
        <fa-icon [icon]="faUsers" class="fas fa-users"></fa-icon>
      </div>
    </div>
  </div>
</div>
