<!-- Breadcrumb -->
<nav class="flex p-4 bg-white text-sm text-gray-500" aria-label="Breadcrumb">
  <ol class="inline-flex items-center space-x-1 md:space-x-3">
    <ng-container *ngFor="let item of breadcrumbs">
      <li class="inline-flex items-center">
        <a
          [routerLink]="item.url"
          routerLinkActive="router-link-active"
          class="inline-flex items-center hover:text-primary"
        >
          <fa-icon [icon]="faChevronRight"></fa-icon> {{ item.label }}
        </a>
      </li>
    </ng-container>
  </ol>
</nav>
