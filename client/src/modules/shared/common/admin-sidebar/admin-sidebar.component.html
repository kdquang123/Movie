<div
  class="sidebar bg-darker text-white h-full fixed top-0 left-0 w-64 overflow-y-auto transition-all duration-300"
  [ngClass]="{ 'sidebar-collapsed w-20': collapsed }"
>
  <!-- Logo -->
  <div class="p-4 flex items-center space-x-2 border-b border-gray-800 h-16">
    <fa-icon [icon]="faFilm" class="text-primary text-2xl"></fa-icon>
    <span class="logo-text text-xl font-bold" *ngIf="!collapsed">
      KD<span class="text-primary">Cinema</span>
    </span>
  </div>

  <!-- Navigation -->
  <div class="p-4">
    <div
      class="text-gray-400 uppercase text-xs font-bold mb-4 sidebar-text"
      *ngIf="!collapsed"
    >
      BẢNG ĐIỀU KHIỂN
    </div>

    <nav>
      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 bg-primary bg-opacity-20 text-white rounded-lg mb-1"
      >
        <fa-icon [icon]="faTachometerAlt" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Tổng quan</span>
      </a>

      <div
        class="text-gray-400 uppercase text-xs font-bold mt-6 mb-4 sidebar-text"
        *ngIf="!collapsed"
      >
        QUẢN LÝ
      </div>

      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 text-gray-300 hover:bg-gray-800 rounded-lg mb-1 transition"
      >
        <fa-icon [icon]="faFilm" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Phim</span>
      </a>
      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 text-gray-300 hover:bg-gray-800 rounded-lg mb-1 transition"
      >
        <fa-icon [icon]="faNewspaper" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Tin tức</span>
      </a>
      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 text-gray-300 hover:bg-gray-800 rounded-lg mb-1 transition"
      >
        <fa-icon [icon]="faCalendarAlt" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Lịch chiếu</span>
      </a>
      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 text-gray-300 hover:bg-gray-800 rounded-lg mb-1 transition"
      >
        <fa-icon [icon]="faTags" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Khuyến mãi</span>
      </a>

      <div
        class="text-gray-400 uppercase text-xs font-bold mt-6 mb-4 sidebar-text"
        *ngIf="!collapsed"
      >
        NGƯỜI DÙNG
      </div>

      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 text-gray-300 hover:bg-gray-800 rounded-lg mb-1 transition"
      >
        <fa-icon [icon]="faUsers" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Thành viên</span>
      </a>
      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 text-gray-300 hover:bg-gray-800 rounded-lg mb-1 transition"
      >
        <fa-icon [icon]="faUserShield" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Nhân viên</span>
      </a>

      <div
        class="text-gray-400 uppercase text-xs font-bold mt-6 mb-4 sidebar-text"
        *ngIf="!collapsed"
      >
        KHÁC
      </div>

      <a
        href="#"
        class="flex items-center space-x-3 py-3 px-4 text-gray-300 hover:bg-gray-800 rounded-lg mb-1 transition"
      >
        <fa-icon [icon]="faCog" class="w-5 text-center"></fa-icon>
        <span class="sidebar-text" *ngIf="!collapsed">Cài đặt</span>
      </a>
    </nav>
  </div>

  <!-- Toggle Button -->
  <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-800">
    <button
      (click)="toggleSidebar()"
      class="text-gray-400 hover:text-white flex items-center space-x-2"
    >
      <fa-icon [icon]="collapsed ? faChevronRight : faChevronLeft"></fa-icon>
      <span class="sidebar-text" *ngIf="!collapsed">Thu gọn</span>
    </button>
  </div>
</div>
